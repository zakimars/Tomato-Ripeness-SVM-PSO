[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomato-ripeness"
version = "1.0.0"
description = "Tomato ripeness classification from TCS34725 RGB-C readings with SVM tuned by Particle Swarm Optimization"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "joblib", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]
pi = ["pigpio", "adafruit-blinka", "adafruit-circuitpython-tcs34725", "RPLCD", "smbus2", "hx711"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
